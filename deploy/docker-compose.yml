services:
  nongcanguan:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: nongcanguan
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DB_FILE=/app/runtime/db.json
      # - ADMIN_CODE=change-me-before-public
    volumes:
      - nongcanguan-data:/app/runtime
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  nongcanguan-data:
